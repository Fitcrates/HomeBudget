<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="stylesheet" href="/src/index.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#fcf8f2" id="theme-color" />
  <!-- Committed to a single scheme by the script below. "light dark" would let the
       OS preference decide the UA chrome, which paints white status-bar glyphs over
       the app in light mode whenever the phone itself is in dark mode. -->
  <meta name="color-scheme" content="light" id="color-scheme" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-style" />
  <script>
    try {
      const isDark = localStorage.getItem("homebudget_theme") === "dark";
      const color = isDark ? "#0a0a0a" : "#fcf8f2";
      document.documentElement.classList.toggle("dark", isDark);
      document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      document
        .getElementById("color-scheme")
        .setAttribute("content", isDark ? "dark" : "light");
      document.documentElement.style.backgroundColor = color;
      document.getElementById("theme-color").setAttribute("content", color);
      document
        .getElementById("apple-status-bar-style")
        .setAttribute("content", isDark ? "black" : "default");
    } catch {}
  </script>

  <title>SpendyAI</title>

  <meta property="og:image" content="/og-preview.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
